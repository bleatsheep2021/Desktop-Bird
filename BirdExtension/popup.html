<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 200px;
            font-family: Arial;
            padding: 10px;
        }

        button, select {
            width: 100%;
            margin: 5px 0;
        }
    </style>
</head>

<body>

<h3>Bird Colour</h3>

<button id="blue">
Blue Bird
</button>

<button id="brown">
Brown Bird
</button>


<h3>Number of Birds</h3>

<select id="count">
    <option value="1">1 Bird</option>
    <option value="2">2 Birds</option>
    <option value="3">3 Birds</option>
    <option value="4">4 Birds</option>
    <option value="5">5 Birds</option>
</select>


<h3>Debug</h3>

<button id="forceLand">
Force Land Now
</button>

<label style="display:flex; align-items:center; gap:6px; margin-top:5px;">
    <input type="checkbox" id="autoLand">
    Auto Land
</label>


<script src="popup.js"></script>

</body>
</html>
